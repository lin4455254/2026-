    <script>
        // Firebase 設定與環境檢查
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rhythmic-gymnastics-2026';
        
        // 初始化 Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 參數定義
        const CAMP_WEEKS = [
            { id: 'week1', label: '第一週 (8/03 - 8/07)' },
            { id: 'week2', label: '第二週 (8/10 - 8/14)' },
            { id: 'week3', label: '第三週 (8/17 - 8/21)' },
        ];
        const PRICING = { full: { 1: 7000, 2: 12000, 3: 15000 } };

        let state = {
            weeks: [],
            participants: [{ name: '', age: '' }],
            total: 0,
            individualPrice: 0
        };

        // 初始化週數列表 (修正 GitHub 可能無法顯示的問題：改為純 JS 渲染)
        function initWeeks() {
            const weeksList = document.getElementById('weeks-list');
            weeksList.innerHTML = '';
            CAMP_WEEKS.forEach(w => {
                const div = document.createElement('div');
                div.id = `item-${w.id}`;
                div.className = "week-item flex items-center justify-between p-5 rounded-2xl border-2 transition-all cursor-pointer border-[#f0ecec] bg-[#fcfafa]";
                div.innerHTML = `
                    <span class="font-bold text-[#b4b4b4]">${w.label}</span>
                    <div class="check w-6 h-6 rounded-lg border-2 border-[#d1d1d1] bg-white"></div>
                `;
                div.addEventListener('click', () => toggleWeek(w.id));
                weeksList.appendChild(div);
            });
        }

        function toggleWeek(id) {
            const index = state.weeks.indexOf(id);
            if (index > -1) {
                state.weeks.splice(index, 1);
            } else {
                state.weeks.push(id);
            }
            
            // 更新 UI 狀態
            const el = document.getElementById(`item-${id}`);
            const isSelected = state.weeks.includes(id);
            if (isSelected) {
                el.classList.add('active', 'border-[#b8a6a6]', 'bg-[#fdfafb]');
                el.querySelector('span').classList.replace('text-[#b4b4b4]', 'text-[#5e5e5e]');
                el.querySelector('.check').classList.replace('bg-white', 'bg-[#b8a6a6]');
            } else {
                el.classList.remove('active', 'border-[#b8a6a6]', 'bg-[#fdfafb]');
                el.querySelector('span').classList.replace('text-[#5e5e5e]', 'text-[#b4b4b4]');
                el.querySelector('.check').classList.replace('bg-[#b8a6a6]', 'bg-white');
            }
            updateTotal();
        }

        function renderParticipants() {
            const container = document.getElementById('participants-container');
            container.innerHTML = '';
            state.participants.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = "grid grid-cols-3 gap-4 p-5 bg-[#fcfafa] rounded-[1.5rem] border border-[#f0ecec]";
                div.innerHTML = `
                    <div class="col-span-2">
                        <input required placeholder="學員 ${i+1} 姓名" class="w-full px-4 py-3 text-sm bg-white border border-[#e2d5d5] rounded-xl outline-none" value="${p.name}" oninput="state.participants[${i}].name=this.value">
                    </div>
                    <div>
                        <input required type="number" placeholder="年齡" class="w-full px-4 py-3 text-sm bg-white border border-[#e2d5d5] rounded-xl outline-none" value="${p.age}" oninput="state.participants[${i}].age=this.value">
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 人數切換
        document.querySelectorAll('.count-btn').forEach(btn => {
            btn.onclick = () => {
                const count = parseInt(btn.dataset.count);
                document.querySelectorAll('.count-btn').forEach(b => {
                    b.classList.remove('bg-white', 'text-[#b8a6a6]', 'shadow-sm');
                    b.classList.add('text-[#b4b4b4]');
                });
                btn.classList.add('bg-white', 'text-[#b8a6a6]', 'shadow-sm');
                btn.classList.remove('text-[#b4b4b4]');
                
                const oldParticipants = [...state.participants];
                state.participants = Array.from({length: count}, (_, i) => oldParticipants[i] || {name: '', age: ''});
                renderParticipants();
                updateTotal();
            };
        });

        function updateTotal() {
            const count = state.participants.length;
            const weekCount = state.weeks.length;
            
            state.individualPrice = (PRICING.full[weekCount] || 0);
            
            let base = state.individualPrice * count;
            let discountNote = "";
            if (count >= 3) {
                base *= 0.9;
                discountNote = " (三人9折)";
            } else if (count === 2) {
                base *= 0.95;
                discountNote = " (二人95折)";
            }
            
            state.total = Math.round(base);

            document.getElementById('individual-display').innerText = `$${state.individualPrice.toLocaleString()}`;
            document.getElementById('total-display').innerText = `$${state.total.toLocaleString()}`;
            document.getElementById('participant-summary').innerText = `共 ${count} 位學員${discountNote}`;
        }

        function copyAccount() {
            const text = document.getElementById('account-num').innerText;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("帳號已複製");
        }

        // 提交表單
        document.getElementById('enrollment-form').onsubmit = async (e) => {
            e.preventDefault();
            if (state.weeks.length === 0) return alert("請至少選擇一個週數");
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner inline-block mr-2">⌛</span>提交中...';

            try {
                // Firebase 匿名登錄
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                    await auth.signInAnonymously();
                }

                const parentName = document.getElementById('parentName').value;
                const phone = document.getElementById('phone').value;
                const bankLastFive = document.getElementById('bankLastFive').value;

                const data = {
                    parentName,
                    phone,
                    bankLastFive,
                    weeks: state.weeks,
                    participants: state.participants,
                    totalPrice: state.total,
                    location: "竹東鎮星都匯C區",
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                // 儲存資料
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('registrations').add(data);
                
                // 成功頁面處理
                document.getElementById('form-container').classList.add('hidden');
                document.getElementById('success-container').classList.remove('hidden');
                document.getElementById('success-total').innerText = `NT$ ${state.total.toLocaleString()}`;
                
                // LINE 訊息生成
                const selectedWeeksStr = CAMP_WEEKS.filter(w => state.weeks.includes(w.id)).map(w => w.label.split(' ')[0]).join('、');
                const pStr = state.participants.map((p, idx) => `${idx + 1}. ${p.name} (${p.age}歲)`).join('\n');
                const discountInfo = state.participants.length === 3 ? " (三人9折)" : (state.participants.length === 2 ? " (二人95折)" : "");
                
                const msg = `您好！我已完成報名預約 ✨\n\n📍 地點：竹東鎮星都匯C區\n👤 家長：${parentName}\n📞 電話：${phone}\n📅 報名週數：${selectedWeeksStr}\n👧 報名學員：\n${pStr}\n💰 應繳總額：NT$ ${state.total.toLocaleString()}${discountInfo}\n🔢 帳號後五碼：${bankLastFive || '待匯款後提供'}\n\n請協助核對資料，謝謝！`;
                
                document.getElementById('line-link').href = `https://line.me/R/oaMessage/@904sjunh/?${encodeURIComponent(msg)}`;
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (err) {
                console.error(err);
                alert("發生錯誤，請稍後再試。");
                btn.disabled = false;
                btn.innerText = "確認送出報名";
            }
        };

        // 初始執行
        window.onload = () => {
            initWeeks();
            renderParticipants();
        };
    </script>
</body>
</html>
