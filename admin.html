```html
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 夏令營報名管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .stat-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .data-table tr:nth-child(even) { background-color: #f8fafc; }
        .data-table tr:hover { background-color: #eff6ff; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app">
        <!-- 登入驗證層 -->
        <div id="login-layer" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/95 backdrop-blur-md p-6 text-center">
            <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">🔐</div>
                <h1 class="text-2xl font-black text-slate-800 mb-2">管理員登入</h1>
                <p class="text-slate-400 text-sm mb-8">請輸入密碼以讀取報名資料</p>
                <input type="password" id="admin-password" class="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl mb-4 outline-none focus:ring-2 focus:ring-blue-500 text-center tracking-[1em]" placeholder="••••">
                <button onclick="handleLogin()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold hover:bg-blue-700 transition-all shadow-lg">解鎖後台</button>
                <p id="login-error" class="text-red-500 text-xs mt-4 hidden">密碼錯誤，請重新嘗試</p>
            </div>
        </div>

        <!-- 主內容區 -->
        <div id="main-content" class="hidden p-4 md:p-10 max-w-7xl mx-auto">
            <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
                <div>
                    <h2 class="text-3xl font-black text-slate-800 tracking-tight">夏令營報名總覽</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        <p class="text-slate-500 text-sm font-medium">即時資料同步中</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="exportCSV()" class="px-5 py-3 bg-white border border-slate-200 rounded-xl font-bold text-sm hover:bg-slate-50 shadow-sm">匯出 Excel (CSV)</button>
                    <button onclick="window.location.reload()" class="px-5 py-3 bg-slate-800 text-white rounded-xl font-bold text-sm hover:bg-slate-700 shadow-md">重新整理</button>
                </div>
            </header>

            <!-- 數據統計區 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="stat-card bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">報名總家長數</p>
                    <h3 class="text-4xl font-black text-slate-800" id="stat-parents">0</h3>
                </div>
                <div class="stat-card bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">每週分佈 (人次)</p>
                    <div class="flex gap-4 mt-2">
                        <div class="text-center"><p class="text-[10px] text-blue-500 font-bold">W1</p><p id="week-1-count" class="text-xl font-black text-blue-600">0</p></div>
                        <div class="text-center"><p class="text-[10px] text-purple-500 font-bold">W2</p><p id="week-2-count" class="text-xl font-black text-purple-600">0</p></div>
                        <div class="text-center"><p class="text-[10px] text-rose-500 font-bold">W3</p><p id="week-3-count" class="text-xl font-black text-rose-600">0</p></div>
                    </div>
                </div>
                <div class="stat-card bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100">
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-1">預計總收入</p>
                    <h3 class="text-4xl font-black text-emerald-600" id="stat-revenue">$0</h3>
                </div>
            </div>

            <!-- 名單表格 -->
            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="data-table w-full text-left">
                        <thead class="bg-slate-50 text-slate-400 text-[10px] font-black uppercase tracking-widest">
                            <tr>
                                <th class="px-8 py-5">家長資訊</th>
                                <th class="px-8 py-5">匯款後五碼</th>
                                <th class="px-8 py-5">報名週數</th>
                                <th class="px-8 py-5">學員名單</th>
                                <th class="px-8 py-5 text-right">應收總額</th>
                            </tr>
                        </thead>
                        <tbody id="data-list" class="divide-y divide-slate-50 text-sm">
                            <tr>
                                <td colspan="5" class="px-8 py-20 text-center text-slate-300">正在加載報名數據...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'rhythmic-gymnastics-2026';

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allData = [];

        function handleLogin() {
            const pass = document.getElementById('admin-password').value;
            if (pass === '2026') {
                document.getElementById('login-layer').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                startSync();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        async function startSync() {
            try {
                await firebase.auth().signInAnonymously();
                const colPath = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('registrations');
                
                colPath.onSnapshot((snapshot) => {
                    allData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    allData.sort((a, b) => (b.submittedAt?.seconds || 0) - (a.submittedAt?.seconds || 0));
                    renderUI(allData);
                });
            } catch (err) {
                console.error("Firebase Sync Error:", err);
            }
        }

        function renderUI(data) {
            const list = document.getElementById('data-list');
            list.innerHTML = '';
            
            let totalParents = data.length;
            let totalRev = 0;
            let weekStats = { week1: 0, week2: 0, week3: 0 };

            if (data.length === 0) {
                list.innerHTML = '<tr><td colspan="5" class="px-8 py-20 text-center text-slate-300">目前尚無報名資料</td></tr>';
                return;
            }

            data.forEach(item => {
                const kidsCount = item.participants?.length || 0;
                totalRev += (item.totalPrice || 0);

                if (item.weeks?.includes('week1')) weekStats.week1 += kidsCount;
                if (item.weeks?.includes('week2')) weekStats.week2 += kidsCount;
                if (item.weeks?.includes('week3')) weekStats.week3 += kidsCount;

                const weekMapping = { 'week1': 'W1', 'week2': 'W2', 'week3': 'W3' };
                const weeksBadge = (item.weeks || []).map(w => `<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-[10px] font-bold mr-1">${weekMapping[w]}</span>`).join('');
                const kidsText = (item.participants || []).map(p => `<div class="font-bold text-slate-700">${p.name} <span class="text-[10px] text-slate-400 font-normal">(${p.age}歲)</span></div>`).join('');
                const date = item.submittedAt ? new Date(item.submittedAt.seconds * 1000).toLocaleDateString('zh-TW') : '處理中';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-8 py-6">
                        <div class="font-bold text-slate-800">${item.parentName}</div>
                        <div class="text-xs text-slate-400">${item.phone}</div>
                        <div class="text-[10px] text-slate-300 mt-1">${date}</div>
                    </td>
                    <td class="px-8 py-6">
                        ${item.bankLastFive ? 
                            `<span class="inline-flex items-center px-3 py-1 bg-emerald-50 text-emerald-700 rounded-full font-mono font-bold border border-emerald-100">
                                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full mr-2"></span>
                                ${item.bankLastFive}
                             </span>` : 
                            '<span class="text-slate-300 italic text-xs">未填寫</span>'}
                    </td>
                    <td class="px-8 py-6">${weeksBadge}</td>
                    <td class="px-8 py-6">${kidsText}</td>
                    <td class="px-8 py-6 text-right font-black text-slate-800">NT$ ${(item.totalPrice || 0).toLocaleString()}</td>
                `;
                list.appendChild(tr);
            });

            document.getElementById('stat-parents').innerText = totalParents;
            document.getElementById('stat-revenue').innerText = `$${totalRev.toLocaleString()}`;
            document.getElementById('week-1-count').innerText = weekStats.week1;
            document.getElementById('week-2-count').innerText = weekStats.week2;
            document.getElementById('week-3-count').innerText = weekStats.week3;
        }

        function exportCSV() {
            if (allData.length === 0) return alert("尚無資料可匯出");
            let csv = "\uFEFF家長姓名,電話,匯款後五碼,報名週數,學員名單,總金額,報名時間\n";
            allData.forEach(row => {
                const kids = (row.participants || []).map(p => `${p.name}(${p.age}歲)`).join(';');
                const weeks = (row.weeks || []).join(';');
                const time = row.submittedAt ? new Date(row.submittedAt.seconds * 1000).toLocaleString() : '';
                csv += `"${row.parentName}","${row.phone}","${row.bankLastFive || ''}","${weeks}","${kids}",${row.totalPrice},"${time}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `夏令營報名名單_含後五碼_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        document.getElementById('admin-password').addEventListener('keyup', (e) => { if (e.key === 'Enter') handleLogin(); });
    </script>
</body>
</html>
